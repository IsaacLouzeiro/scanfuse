[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scanwitness"
dynamic = ["version"]
description = "Runs wafw00f, shcheck, sslscan and whatweb and consolidates the results into HTML, Markdown and CSV reports with severity, evidence and recommendations per target"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac E. Louzeiro" }]
keywords = ["security", "pentest", "recon", "tls", "security-headers", "waf", "report",
            "vulnerability-scanner", "owasp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = ["wafw00f", "shcheck"]

[project.scripts]
scanwitness = "scanwitness:main"

[project.urls]
Homepage = "https://github.com/IsaacLouzeiro/scanwitness"
Issues = "https://github.com/IsaacLouzeiro/scanwitness/issues"
Changelog = "https://github.com/IsaacLouzeiro/scanwitness/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["scanwitness"]

[tool.setuptools.dynamic]
version = { attr = "scanwitness.__version__" }
